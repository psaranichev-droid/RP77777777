<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Интернет-магазин качественной бумаги и картона. Офсетная, мелованная, дизайнерская бумага. Доставка по России." />
    <meta name="keywords" content="бумага для печати, картон, офсетная бумага, мелованная бумага, дизайнерская бумага" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="author" content="Paper Shop" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph для соц сетей -->
    <meta property="og:title" content="Paper Shop - Качественная бумага и картон" />
    <meta property="og:description" content="Интернет-магазин бумаги и картона с доставкой по России" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yoursite.com/" />
    <meta property="og:image" content="https://yoursite.com/og-image.png" />
    <meta property="og:site_name" content="Paper Shop" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paper Shop - Качественная бумага" />
    <meta name="twitter:description" content="Доставка бумаги по России. Лучшие цены!" />
    <meta name="twitter:image" content="https://yoursite.com/twitter-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://yoursite.com/" />

    <!-- Alternate versions -->
    <link rel="alternate" hreflang="ru" href="https://yoursite.com/" />
    <link rel="alternate" hreflang="en" href="https://en.yoursite.com/" />

    <!-- Preconnect для быстрого соединения -->
    <link rel="preconnect" href="https://api.yoursite.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <title>Paper Shop - Качественная бумага и картон для вашего бизнеса</title>

    <!-- Preload критичных шрифтов для лучшей производительности -->
    <link rel="preload" href="/fonts/inter-cyrillic-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-cyrillic-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-cyrillic-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/rubik-cyrillic-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/rubik-cyrillic-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/rubik-cyrillic-700.woff2" as="font" type="font/woff2" crossorigin />



    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
